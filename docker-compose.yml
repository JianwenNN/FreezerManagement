services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freezer_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/freezer_management
      # Alembic's env.py checks this specific variable (added for CI) and
      # falls back to a hardcoded 127.0.0.1 default if it's not set —
      # which fails inside Docker, since 127.0.0.1 there means "this
      # container itself," not the db service.
      ALEMBIC_DATABASE_URL: postgresql://postgres:password@db:5432/freezer_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the compiled JS at build time — update this if your
        # domain or backend port ever changes. Uses the domain, not an IP,
        # so this survives EC2 IP changes as long as DNS points correctly.
        VITE_API_URL: http://jianw-inventory.duckdns.org:8000/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
