services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freezer_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: 927864662216.dkr.ecr.us-east-1.amazonaws.com/freezer-backend:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/freezer_management
      # Alembic's env.py checks this specific variable (added for CI) and
      # falls back to a hardcoded 127.0.0.1 default if it's not set —
      # which fails inside Docker, since 127.0.0.1 there means "this
      # container itself," not the db service.
      ALEMBIC_DATABASE_URL: postgresql://postgres:password@db:5432/freezer_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: 927864662216.dkr.ecr.us-east-1.amazonaws.com/freezer-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
