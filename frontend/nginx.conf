server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that doesn't match a real file falls back to
    # index.html, so React Router's client-side routes work on direct
    # navigation and page refresh, not just in-app clicks.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
